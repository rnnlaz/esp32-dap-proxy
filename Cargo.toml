[package]
name = "esp-daplink-host"
version = "0.1.0"
edition = "2024"

[dependencies]
socket2 = "0.6.5"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# Web 控制台
axum = "0.8"
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
